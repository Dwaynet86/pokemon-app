<!doctype html>
<html lang="en" data-mode="{{ theme.mode }}"{% if theme.style %} style="{{ theme.style }}"{% endif %}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}Pokémon Cards{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</head>
<body>
  {# Signed-out visitors: no navigation and no links into the app. #}
  <header class="topbar">
    <span class="brand"><img class="brand-logo" src="{{ url_for('static', filename='img/logo.png') }}" alt="Pokémon Cards"></span>
  </header>
  <main class="page">{% block content %}{% endblock %}</main>
</body>
</html>
